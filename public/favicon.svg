<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="UU MLC Nexus">
  <title>UU MLC Nexus</title>
  <!--
    Derived from the club logo: a black geometric monogram on marigold amber.
    Drawn as paths rather than <text> so it renders identically everywhere —
    a favicon has no fonts to fall back on.
  -->
  <rect width="32" height="32" rx="7" fill="#f2a81c" />
  <g fill="none" stroke="#12100b" stroke-width="3.1" stroke-linecap="square" stroke-linejoin="miter">
    <!-- M -->
    <path d="M6 23V9l5 6 5-6v14" />
    <!-- L -->
    <path d="M21 9v14h5" />
  </g>
</svg>
