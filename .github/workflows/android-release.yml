name: Android release APK

# Builds a SIGNED release APK for direct sideloading (no Play Store — see
# docs/android-release.md). Runs only on a version tag (v*) or a manual run, so
# the fast PR/main CI in ci.yml is untouched. Requires these repository secrets:
#   ANDROID_KEYSTORE_BASE64    base64 of your .jks / .keystore file
#   ANDROID_KEYSTORE_PASSWORD  keystore (store) password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password
#   VITE_SUPABASE_URL          already set — inlined into the web bundle
#   VITE_SUPABASE_ANON_KEY     already set — inlined into the web bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write # so a tagged build can publish the APK to its GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Capacitor's generated capacitor.build.gradle targets Java 21.
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Sync web assets into the Android project
        run: npx cap sync android

      - name: Prepare release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is empty — add the signing secrets (see docs/android-release.md) before running this workflow."
            exit 1
          fi
          # Materialise the keystore next to the app module; key.properties uses a
          # path relative to android/app/. Both are .gitignored and live only on
          # this ephemeral runner. printf '%s' writes each secret verbatim, so
          # shell metacharacters in a password can't corrupt the file.
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          {
            echo "storeFile=release.keystore"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > android/key.properties

      - name: Assemble signed release APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the APK
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$SRC" ]; then
            echo "::error::Expected signed APK not found at $SRC (was the build signed?)."
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            NAME="uu-mlc-nexus-${GITHUB_REF_NAME}.apk"
          else
            NAME="uu-mlc-nexus-dev-${GITHUB_RUN_NUMBER}.apk"
          fi
          cp "$SRC" "$NAME"
          echo "path=$NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.path }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
